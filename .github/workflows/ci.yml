name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Começa sem bloquear: são 4 advisories remanescentes, todos de
      # ferramenta de dev (vitest/eslint). O grafo de PRODUÇÃO está limpo.
      # Depois de duas semanas, tire o continue-on-error para virar gate.
      - name: Audit (produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Audit (tudo, informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public placeholders so `next build` can run without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
