name: Fetch news

# Vercel Hobby crons run at most once/day, so we schedule from GitHub Actions
# (free, arbitrary frequency) and call the protected fetch endpoint.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news fetch
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "Missing APP_URL repo secret (e.g. https://cortex-raoni.vercel.app)." >&2
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing required CRON_SECRET repo secret." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/articles/fetch")
          echo "HTTP ${code}"
          cat /tmp/out.json || true
          echo
          test "${code}" = "200"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Backfill article images
        # Best-effort: fills missing images (incl. Google News) in batches.
        continue-on-error: true
        run: |
          [ -z "${APP_URL}" ] && exit 0
          [ -z "${CRON_SECRET}" ] && exit 1
          for n in 1 2 3; do
            code=$(curl -sS -o /tmp/img.json -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/articles/backfill-images")
            echo "backfill ${n}: HTTP ${code}"; cat /tmp/img.json || true; echo
          done
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Enrich partial article text
        # Best-effort and public pages only. Paid/unavailable content remains
        # explicitly marked as partial in the monthly PDF.
        continue-on-error: true
        run: |
          [ -z "${APP_URL}" ] && exit 0
          [ -z "${CRON_SECRET}" ] && exit 1
          for n in 1 2; do
            code=$(curl -sS -o /tmp/enrich.json -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/articles/enrich")
            echo "enrich ${n}: HTTP ${code}"; cat /tmp/enrich.json || true; echo
          done
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
